name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1

      - name: Start EC2 instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name, Values=tabi-note-dev-app-ec2" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          aws ec2 start-instances --instance-ids $INSTANCE_ID
          aws ec2 wait instance-running --instance-ids $INSTANCE_ID

      - name: Public IP
        id: ip
        uses: haythem/public-ip@v1.3

      - name: Authorize security group
        id: sg
        run: |
          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=tag:Name,Values=tabi-note-dev-web-sg" \
            --query "SecurityGroups[0].GroupId" \
            --output text)
          echo "sg_id=$SG_ID" >> $GITHUB_OUTPUT
          aws ec2 authorize-security-group-ingress \
            --group-id $SG_ID --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.EC2_PUBLIC_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ec2-user/tabi-note-deploy
            git pull
            cd tabi-note-api && git pull && cd ..
            cd tabi-note-front && git pull && cd ..
            docker compose build api
            docker compose build front
            docker compose up -d

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.EC2_PUBLIC_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sleep 30
            docker compose -f /home/ec2-user/tabi-note-deploy/docker-compose.yml ps | grep "Up"

      - name: Revoke security group
        run: |
          aws ec2 revoke-security-group-ingress \
          --group-id ${{ steps.sg.outputs.sg_id }} \
          --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Show app URL
        run: echo "http://${{ vars.EC2_PUBLIC_IP }}:3000"
